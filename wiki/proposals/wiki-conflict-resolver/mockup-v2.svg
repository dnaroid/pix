<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .bg{fill:#1c1d21}.panel{fill:#232429}.line{stroke:#34363d}.t{fill:#e6e6e9}.m{fill:#8b8d96}.s{fill:#6c6e77}
      .red{fill:#e5534b}.amb{fill:#d4a72c}.grn{fill:#57ab5a}.blue{fill:#539bf5}
      .chip{fill:#2d2f36}.sel{fill:#2b3446}.hlR{fill:#e5534b33}.hlB{fill:#539bf533}
      .btn{fill:#2d2f36;stroke:#3d4049}.pri{fill:#316dca}
      .mono{font-family:'SF Mono',Menlo,monospace;font-size:11.5px}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>

  <!-- tab bar -->
  <rect class="panel" width="1280" height="34"/>
  <text x="16" y="22" class="m">Preview · configuration/guide.md</text>
  <rect x="236" y="4" width="170" height="30" rx="4" fill="#1c1d21"/>
  <text x="250" y="23" class="t" font-weight="600">⚠ Wiki Conflicts</text>
  <rect x="368" y="11" width="26" height="16" rx="8" class="red"/><text x="375" y="23" fill="#fff" font-size="11">12</text>
  <line x1="0" y1="34" x2="1280" y2="34" class="line"/>

  <!-- inbox -->
  <rect x="0" y="35" width="320" height="725" class="panel"/>
  <line x1="320" y1="35" x2="320" y2="760" class="line"/>
  <text x="16" y="60" class="t" font-weight="600">12 открыто</text>
  <text x="92" y="60" class="m">· 3 неопр. · 2 устарели · 5 решено</text>
  <rect x="16" y="70" width="288" height="26" rx="4" class="btn"/><text x="98" y="87" class="t">↻ Проверить всё изменённое</text>
  <g>
    <rect x="16" y="106" width="64" height="22" rx="11" class="sel"/><text x="27" y="121" class="t">Открыто</text>
    <rect x="86" y="106" width="74" height="22" rx="11" class="chip"/><text x="97" y="121" class="m">Отложено</text>
    <rect x="166" y="106" width="70" height="22" rx="11" class="chip"/><text x="177" y="121" class="m">Все виды ▾</text>
    <rect x="242" y="106" width="62" height="22" rx="11" class="chip"/><text x="252" y="121" class="m">Ветка ▾</text>
  </g>
  <text x="16" y="150" class="s" font-size="11">ГРУППИРОВКА: ПАРА ДОКУМЕНТОВ ▾</text>

  <!-- group 1 -->
  <text x="16" y="174" class="t" font-weight="600">configuration/guide.md ↔ search/native…</text>
  <text x="290" y="174" class="m">3</text>
  <rect x="8" y="182" width="304" height="46" rx="4" class="sel"/>
  <rect x="8" y="182" width="3" height="46" class="blue"/>
  <circle cx="26" cy="198" r="5" class="red"/>
  <text x="38" y="202" class="t">Семантический провайдер: проектный…</text>
  <text x="38" y="219" class="m">guide.md:212 ↔ native…md:44 · 2 дн.</text>
  <circle cx="26" cy="246" r="5" class="red"/>
  <text x="38" y="250" class="t">Согласие на источник vs глобальный…</text>
  <text x="38" y="267" class="m">guide.md:230 ↔ native…md:61</text>
  <path d="M21 288 l5 -9 l5 9 z" class="amb"/>
  <text x="38" y="290" class="t">Lexical «без записей» — область?</text>
  <text x="38" y="307" class="m">неопределённость · troubleshooting.md:18</text>

  <!-- group 2 -->
  <text x="16" y="340" class="t" font-weight="600">development/release/guide.md ↔ ci-rel…</text>
  <text x="290" y="340" class="m">2</text>
  <circle cx="26" cy="362" r="5" class="red"/>
  <text x="38" y="366" class="t">Семь ассетов vs текущая матрица</text>
  <text x="38" y="383" class="m">guide.md:88 ↔ ci-release.md:140</text>
  <circle cx="26" cy="404" r="5" fill="none" stroke="#8b8d96" stroke-dasharray="2 2"/>
  <text x="38" y="408" class="m">Четыре updater-таргета</text>
  <rect x="200" y="396" width="84" height="18" rx="9" class="chip"/><text x="208" y="409" class="m" font-size="11">устарело ↻</text>
  <text x="38" y="425" class="s">цитата не найдена — возможно, исправлено</text>

  <!-- group 3 -->
  <text x="16" y="458" class="t" font-weight="600">getting-started/llm-install.md · внутр.</text>
  <circle cx="26" cy="480" r="5" class="red"/>
  <text x="38" y="484" class="t">macOS-only vs ветки Windows/Linux</text>
  <text x="38" y="501" class="m">одна страница · :3 ↔ :140</text>
  <rect x="210" y="490" width="74" height="18" rx="9" fill="#316dca44"/><text x="218" y="503" class="blue" font-size="11">🤖 в работе</text>

  <!-- basket -->
  <rect x="8" y="700" width="304" height="48" rx="6" fill="#2b3446"/>
  <text x="20" y="720" class="t">Корзина: 4 находки · 3 страницы</text>
  <rect x="20" y="727" width="200" height="16" rx="3" class="pri"/>
  <text x="30" y="739" fill="#fff" font-size="11">Разрулить в новой сессии</text>
  <text x="232" y="739" class="m" font-size="11">Очистить</text>

  <!-- compare header -->
  <text x="340" y="62" class="t" font-size="15" font-weight="600">Семантический провайдер: проектный файл vs глобальная конфигурация</text>
  <circle cx="345" cy="80" r="5" class="red"/><text x="356" y="84" class="m">Противоречие · судья: anthropic/claude-sonnet · проверено 2 дня назад · 1 из 12</text>

  <!-- left column -->
  <rect x="336" y="98" width="460" height="390" rx="6" class="panel"/>
  <text x="352" y="120" class="t" font-weight="600">configuration/guide.md</text>
  <text x="352" y="137" class="m">строки 212–214 · изменено 3 недели назад</text>
  <rect x="640" y="108" width="72" height="18" rx="9" class="chip"/><text x="650" y="121" class="m" font-size="11">guide</text>
  <text x="352" y="160" class="s" font-size="11">§ Semantic search ▸ Project settings</text>
  <line x1="352" y1="168" x2="780" y2="168" class="line"/>
  <g class="mono">
    <text x="352" y="190" class="s">209</text><text x="384" y="190" class="m">Semantic search is optional and</text>
    <text x="352" y="208" class="s">210</text><text x="384" y="208" class="m">disabled by default.</text>
    <text x="352" y="226" class="s">211</text>
    <rect x="378" y="232" width="404" height="56" class="hlR"/>
    <text x="352" y="246" class="s">212</text><text x="384" y="246" class="t">Enable it per project in</text>
    <text x="352" y="264" class="s">213</text><text x="384" y="264" class="t">`.pi/search/semantic.json` and pin a</text>
    <text x="352" y="282" class="s">214</text><text x="384" y="282" class="t">provider for each source.</text>
    <text x="352" y="300" class="s">215</text>
    <text x="352" y="318" class="s">216</text><text x="384" y="318" class="m">Run `/search reindex` after changes.</text>
  </g>
  <rect x="352" y="450" width="120" height="24" rx="4" class="btn"/><text x="368" y="466" class="t">Открыть в Preview</text>
  <rect x="480" y="450" width="128" height="24" rx="4" class="btn"/><text x="494" y="466" class="t">✎ Редактировать (e)</text>

  <!-- right column -->
  <rect x="808" y="98" width="460" height="390" rx="6" class="panel"/>
  <text x="824" y="120" class="t" font-weight="600">search/native-repository-search.md</text>
  <text x="824" y="137" class="m">строки 44–45 · изменено 4 дня назад</text>
  <rect x="1160" y="108" width="92" height="18" rx="9" fill="#57ab5a33"/><text x="1170" y="121" class="grn" font-size="11">spec · active</text>
  <text x="824" y="160" class="s" font-size="11">§ Configuration ▸ Embedding</text>
  <line x1="824" y1="168" x2="1252" y2="168" class="line"/>
  <g class="mono">
    <text x="824" y="190" class="s">41</text><text x="852" y="190" class="m">Search configuration is global.</text>
    <text x="824" y="208" class="s">42</text>
    <text x="824" y="226" class="s">43</text><text x="852" y="226" class="m">Project selection controls sources.</text>
    <rect x="846" y="232" width="406" height="38" class="hlB"/>
    <text x="824" y="246" class="s">44</text><text x="852" y="246" class="t">Embeddings use the global</text>
    <text x="824" y="264" class="s">45</text><text x="852" y="264" class="t">`search.embedding`; no project file.</text>
    <text x="824" y="282" class="s">46</text>
    <text x="824" y="300" class="s">47</text><text x="852" y="300" class="m">See ADR 0068 for rationale.</text>
  </g>
  <rect x="824" y="450" width="120" height="24" rx="4" class="btn"/><text x="840" y="466" class="t">Открыть в Preview</text>
  <rect x="952" y="450" width="128" height="24" rx="4" class="btn"/><text x="966" y="466" class="t">✎ Редактировать (E)</text>

  <!-- explanation -->
  <rect x="336" y="500" width="932" height="70" rx="6" fill="#2a2326" stroke="#e5534b55"/>
  <text x="352" y="522" class="t" font-weight="600">Почему это противоречие</text>
  <text x="352" y="542" class="m">Обе страницы описывают текущую настройку embeddings для одного проекта: одна требует проектный</text>
  <text x="352" y="558" class="m">файл и провайдер на источник, другая запрещает проектный файл и требует глобальную конфигурацию. ▾ ещё</text>

  <!-- decision bar -->
  <rect x="336" y="584" width="932" height="164" rx="6" class="panel"/>
  <text x="352" y="608" class="t" font-weight="600">Решение</text>
  <text x="420" y="608" class="m">судья не выбирает сторону — выбираете вы</text>
  <g>
    <rect x="352" y="620" width="172" height="52" rx="5" class="btn"/>
    <text x="364" y="641" class="t" font-weight="600">1 · Права эта страница</text><text x="364" y="660" class="m" font-size="11">править источник</text>
    <rect x="532" y="620" width="172" height="52" rx="5" fill="#2b3446" stroke="#539bf5"/>
    <text x="544" y="641" class="t" font-weight="600">2 · Прав источник</text><text x="544" y="660" class="m" font-size="11">править эту страницу</text>
    <rect x="712" y="620" width="172" height="52" rx="5" class="btn"/>
    <text x="724" y="641" class="t" font-weight="600">3 · Разные области</text><text x="724" y="660" class="m" font-size="11">добавить уточнение</text>
    <rect x="892" y="620" width="172" height="52" rx="5" class="btn"/>
    <text x="904" y="641" class="t" font-weight="600">4 · Ложная тревога</text><text x="904" y="660" class="m" font-size="11">с комментарием</text>
    <rect x="1072" y="620" width="180" height="52" rx="5" class="btn"/>
    <text x="1084" y="641" class="t" font-weight="600">5 · Отложить</text><text x="1084" y="660" class="m" font-size="11">нужно решение владельца</text>
  </g>
  <rect x="352" y="684" width="200" height="28" rx="5" class="pri"/>
  <text x="366" y="703" fill="#fff">🤖 A · Поручить агенту</text>
  <rect x="560" y="684" width="150" height="28" rx="5" class="btn"/>
  <text x="572" y="703" class="t">↻ Перепроверить пару</text>
  <text x="352" y="736" class="s" font-size="11">j/k — находки · [ ] — группы · Space — в корзину · o — Preview · ? — все клавиши</text>
  <text x="1000" y="736" class="s" font-size="11">После правки: «ждёт проверки» → «снято»</text>

  <!-- group 4: decisions (v2) -->
  <text x="16" y="540" class="t" font-weight="600">decisions/0029-window-tiling.md ↔ 0040…</text>
  <circle cx="26" cy="562" r="6" fill="none" stroke="#8b8d96" stroke-width="1.5"/>
  <path d="M23 562 l2 2.5 l4 -5" fill="none" stroke="#8b8d96" stroke-width="1.5"/>
  <text x="38" y="566" class="m">Uniform grid vs gap-free tiling</text>
  <text x="38" y="583" class="s">признано допустимым · «разные области: ADR заменён»</text>
  <circle cx="26" cy="606" r="5" class="amb"/>
  <text x="38" y="610" class="t">Hover vs click popups</text>
  <rect x="38" y="618" width="160" height="18" rx="9" fill="#d4a72c33"/><text x="46" y="631" class="amb" font-size="11">⚠ сохранено частично 1/2</text>
  <text x="206" y="631" class="blue" font-size="11">Повторить запись</text>
  <text x="38" y="652" class="s">0037: запись не прошла — файл изменён</text>
  <!-- tree legend -->
  <text x="16" y="680" class="s" font-size="11">Дерево: ⊘ нейтральный + ✓-иконка = всё признано/отложено</text>
</svg>
