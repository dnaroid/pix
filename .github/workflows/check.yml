name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Check/build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS leg legitimately needs ~10 min (desktop frontend + Rust host +
    # tools suite) and slow-runner days inflate every step ~1.5x; 15 min left
    # no headroom and killed healthy runs, so allow 20.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Show PATH Node and npm
        run: |
          node --version
          npm --version
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
      - name: Install Bun on Windows
        if: runner.os == 'Windows'
        # Align the Windows runtime with the other matrix legs (setup-bun
        # installs the latest release there) so the suite does not depend on
        # platform-specific bun behavior differences.
        run: npm install -g bun@1.4.2
      - run: bun --version
      - run: npm ci --ignore-scripts
      - name: Install ACP adapter
        run: npm ci --prefix acp --ignore-scripts
      - name: Install desktop frontend
        if: runner.os == 'macOS'
        run: npm ci --prefix desktop --ignore-scripts
      - name: Install Chromium for browser QA E2E
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Run shared native CI gate
        run: npm run check:ci
      - name: Upload CI gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-ci-${{ matrix.os }}
          # .pi is hidden; only these explicitly selected logs/summary are uploaded.
          include-hidden-files: true
          path: |
            .pi/artifacts/check-ci-*/summary.json
            .pi/artifacts/check-ci-*/*.log
          if-no-files-found: ignore
