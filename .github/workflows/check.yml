name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Check/build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The complete macOS native gate can pass just before the 20-minute job
    # deadline, leaving no time for artifact upload and post-job cleanup.
    # Allow bounded headroom without skipping any shared CI checks.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Show PATH Node and npm
        run: |
          node --version
          npm --version
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
        with:
          bun-version: 1.4.2
      - name: Install Bun on Windows
        if: runner.os == 'Windows'
        # Use the same pinned Bun runtime across all three matrix legs.
        run: npm install -g bun@1.4.2
      - run: bun --version
      - run: npm ci --ignore-scripts
      - name: Install ACP adapter
        run: npm ci --prefix acp --ignore-scripts
      - name: Install desktop frontend
        if: runner.os == 'macOS'
        run: npm ci --prefix desktop --ignore-scripts
      - name: Install Chromium for browser QA E2E
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Run shared native CI gate
        run: npm run check:ci
      - name: Upload CI gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-ci-${{ matrix.os }}
          # .pi is hidden; only these explicitly selected logs/summary are uploaded.
          include-hidden-files: true
          path: |
            .pi/artifacts/check-ci-*/summary.json
            .pi/artifacts/check-ci-*/*.log
          if-no-files-found: ignore
