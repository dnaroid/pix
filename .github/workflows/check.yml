name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Check/build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS leg legitimately needs ~10 min (desktop frontend + Rust host +
    # tools suite) and slow-runner days inflate every step ~1.5x; 15 min left
    # no headroom and killed healthy runs, so allow 20.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Show PATH Node and npm
        run: |
          node --version
          npm --version
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
      - name: Install Bun on Windows
        if: runner.os == 'Windows'
        # Align the Windows runtime with the other matrix legs (setup-bun
        # installs the latest release there) so the suite does not depend on
        # platform-specific bun behavior differences.
        run: npm install -g bun@1.4.2
      - run: bun --version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install and check ACP adapter
        run: npm ci --prefix acp --ignore-scripts && npm run check:acp
      - name: Install and check desktop frontend
        if: runner.os == 'macOS'
        run: npm ci --prefix desktop --ignore-scripts && npm run check:desktop && npm --prefix desktop test
      - name: Check desktop Rust host
        if: runner.os == 'macOS'
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib backend_runtime
      - name: Windows bun module diagnostic (temporary)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd external/pi-tools-suite
          cat > win-diag-probe.mjs <<'EOF'
          const tui = await import("@earendil-works/pi-tui");
          const t = new tui.Text("x", 0, 0);
          console.log("[probe] resolve:", Bun.resolveSync("@earendil-works/pi-tui", process.cwd()));
          console.log("[probe] direct new Text proto:", Object.getPrototypeOf(t)?.constructor?.name, "setText:", typeof t.setText);
          const { readRenderers } = await import("@earendil-works/pi-coding-agent/dist/core/tools/renderers/read.js");
          const theme = { fg: (_c, s) => s, bold: (s) => s };
          try {
            const comp = readRenderers.renderResult(
              { content: "hello world" },
              { expanded: true, isPartial: false },
              theme,
              { args: { path: "x.txt" }, cwd: ".", showImages: false, isError: false, lastComponent: undefined },
            );
            console.log("[probe] renderResult ok proto:", Object.getPrototypeOf(comp)?.constructor?.name, "render:", typeof comp.render);
          } catch (e) {
            console.log("[probe] renderResult THREW:", String(e));
          }
          EOF
          bun win-diag-probe.mjs || true
          cat > win-diag-test.test.ts <<'EOF'
          import { test } from "bun:test";
          test("diag", async () => {
            const tui = await import("@earendil-works/pi-tui");
            const t = new tui.Text("x", 0, 0);
            console.log("[btest] direct new Text proto:", Object.getPrototypeOf(t)?.constructor?.name, "setText:", typeof t.setText);
            const { readRenderers } = await import("@earendil-works/pi-coding-agent/dist/core/tools/renderers/read.js");
            const theme = { fg: (_c, s) => s, bold: (s) => s };
            const comp = readRenderers.renderResult(
              { content: "hello world" },
              { expanded: true, isPartial: false },
              theme,
              { args: { path: "x.txt" }, cwd: ".", showImages: false, isError: false, lastComponent: undefined },
            );
            console.log("[btest] renderResult ok proto:", Object.getPrototypeOf(comp)?.constructor?.name);
          });
          EOF
          bun test win-diag-test.test.ts || true
          rm -f win-diag-probe.mjs win-diag-test.test.ts
      - run: npm run test:tools-suite
      - name: Install Chromium for browser QA E2E
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Run browser QA mock-page E2E
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:browser-qa-e2e
