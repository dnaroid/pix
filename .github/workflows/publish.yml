name: Publish

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Check/build (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [pinned]
        include:
          - os: ubuntu-latest
            node: "22.19.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.node == 'pinned'
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-node@v4
        if: matrix.node != 'pinned'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
      - name: Install Bun on Windows
        if: runner.os == 'Windows'
        run: npm install -g bun@1.3.14
      - run: bun --version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install and check ACP adapter
        run: npm ci --prefix acp --ignore-scripts && npm run check:acp
      - name: Install and check desktop frontend
        run: npm ci --prefix desktop --ignore-scripts && npm run check:desktop && npm --prefix desktop test
      - name: Check desktop Rust host
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check && cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - run: npm run test:tools-suite
      - name: Install Chromium for browser QA E2E
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Run browser QA mock-page E2E
        if: runner.os == 'Linux'
        run: npm run test:browser-qa-e2e
      - run: npm run build:pix

  package-smoke-test:
    needs: build-and-test
    name: Package smoke test (${{ matrix.os }} / ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: full
          - os: windows-latest
            mode: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full packed-package smoke test
        if: matrix.mode == 'full'
        run: npm run smoke-test
      - name: Packed CLI sanity check
        if: matrix.mode == 'cli'
        run: npm run smoke-test:cli

  build-release:
    needs: package-smoke-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    name: Release packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            acp/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xvfb
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix acp --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - name: Verify tag and all application versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release/sync-version.mjs --check --tag
      - name: Import optional Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'No Apple certificate configured; building with ad-hoc signing.'
            exit 0
          fi
          test -n "$APPLE_SIGNING_IDENTITY"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/pix-signing.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/pix-certificate.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/pix-certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/pix-certificate.p12"
      - name: Import optional Windows signing certificate
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output 'No Windows certificate configured; building unsigned installers.'
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'pix-certificate.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = @(Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object { $_.HasPrivateKey })
            if ($certificate.Count -ne 1) { throw 'Expected exactly one private-key signing certificate' }
            "PIX_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $path -Force -ErrorAction SilentlyContinue }
      - name: Build and test portable TUI and GUI installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run release:build -- ${{ matrix.target }}
      - name: Test native backend path resolution
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib backend_runtime
      - name: Upload package size reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-${{ matrix.target }}
          path: |
            .artifacts/releases/${{ matrix.target }}/pix/SIZE.json
            .artifacts/releases/${{ matrix.target }}/pix/OPTIMIZATIONS.json
            .artifacts/releases/${{ matrix.target }}/desktop/pix/SIZE.json
            .artifacts/releases/${{ matrix.target }}/desktop/pix/OPTIMIZATIONS.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: .artifacts/releases/${{ matrix.target }}/assets/*
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/pix-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/pix-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/pix-certificate.p12"
      - name: Remove Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PIX_WINDOWS_CERTIFICATE_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:PIX_WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'pix-certificate.pfx') -Force -ErrorAction SilentlyContinue

  publish:
    needs: package-smoke-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing (OIDC): the job exchanges a GitHub-issued
      # identity token for a short-lived npm publish token, so no NPM_TOKEN
      # secret is needed. Requires npm >= 11.5 and the npmjs.com trusted
      # publisher entry for pi-ui-extend (repo dnaroid/pix, publish.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:pix
      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public

  github-release:
    needs: [build-release, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: .artifacts/release-assets
      - name: Verify complete matrix and generate checksums
        run: |
          node scripts/release/sync-version.mjs --check --tag
          node scripts/release/checksums.mjs .artifacts/release-assets
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-github.mjs .artifacts/release-assets
